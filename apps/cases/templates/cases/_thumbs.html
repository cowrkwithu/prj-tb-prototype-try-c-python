{# 영상 썸네일 — im 은 apps.imaging.services.study_view (영상 분석과 같은 직렬화). 썸네일 URL 은 이미 완성된 주소다. #}
{% for im in images %}
  <button type="button" class="thumb" @click="open = {{ im.id }}; slice = {{ im.initial_slice|add:0 }}" data-image="{{ im.id }}"
          hx-get="/cases/{{ patient.pk }}/images/{{ im.id }}" hx-target="#image-modal-body" hx-swap="innerHTML"
          data-tip="{% t '누르면 영상을 크게 열어 AI 어노테이션과 전문가 소견을 함께 봅니다.' 'Click to open the image with AI annotations and expert findings.' %}">
    <div class="thumb-img">{% if im.thumb %}<img src="{{ im.thumb }}" alt="{{ im.type }} {{ im.date }}" loading="lazy">{% else %}
      <div class="thumb-placeholder">{% icon "image" "w-6 h-6" %}<span>{% if not im.can_view %}{% t "열람 권한 없음" "No access" %}{% else %}{% t "미리보기 없음 (DICOM)" "No preview (DICOM)" %}{% endif %}</span></div>{% endif %}
      <span class="thumb-type">{{ im.type }}</span>
      {% if im.suv %}<span class="thumb-suv">SUVmax {{ im.suv|floatformat:1 }}</span>{% endif %}
      {% if im.expert_count or im.hidden_expert %}<span class="thumb-expert" data-testid="thumb-expert">{% icon "pencil" "w-3 h-3" %} {{ im.expert_count|add:im.hidden_expert }}</span>{% endif %}</div>
    <div class="thumb-meta"><p class="text-xs text-muted">{{ im.date }} {% if im.sample %}<span class="badge badge-sm badge-neutral">{% t "공개 샘플" "Public sample" %}</span>{% else %}<span class="badge badge-sm badge-teal" data-testid="thumb-upload">{% t "업로드" "Upload" %}</span>{% endif %}</p>
      <p class="text-xs truncate">{% if im.finding_text %}{{ im.finding_text }}{% else %}{% t "정상" "Normal" %}{% endif %}</p></div>
  </button>
{% endfor %}
{% if more_offset %}
  <div class="thumb-more" style="grid-column: 1 / -1" id="thumb-more">
    <button type="button" class="btn btn-secondary btn-sm" hx-get="/cases/{{ patient.pk }}/images?offset={{ more_offset }}" hx-target="#thumb-more" hx-swap="outerHTML" data-testid="thumb-more"
            data-tip="{% t '다음 영상 썸네일 24개를 더 불러옵니다.' 'Load the next 24 image thumbnails.' %}">{% icon "chevron-down" "w-4 h-4" %} {% if is_en %}Show more ({{ more_offset }} / {{ image_total }}){% else %}더보기 ({{ more_offset }} / {{ image_total }}){% endif %}</button>
  </div>
{% endif %}
